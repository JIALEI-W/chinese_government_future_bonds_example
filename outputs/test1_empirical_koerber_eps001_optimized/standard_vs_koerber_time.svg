<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1320" viewBox="0 0 1620 1320" role="img" aria-labelledby="title desc">
  <title id="title">Full MLMC plus adjoint runtime</title>
  <desc id="desc">Standard reverse Cholesky has a median runtime of 14.620 seconds. The optimized Körber calculation has a median runtime of 13.646 seconds, a 6.7 percent reduction.</desc>
  <rect width="1620" height="1320" fill="#ffffff"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#222222">
    <text x="810" y="78" text-anchor="middle" font-size="48" font-weight="600">Full MLMC + Adjoint Runtime</text>
    <text x="810" y="125" text-anchor="middle" font-size="25" fill="#555555">Same ε = 0.01 target and 8,409,664 MLMC samples; median of 5 alternating runs</text>

    <g stroke="#d6d6d6" stroke-width="2">
      <line x1="210" y1="1030" x2="1510" y2="1030"/>
      <line x1="210" y1="769.4" x2="1510" y2="769.4"/>
      <line x1="210" y1="508.8" x2="1510" y2="508.8"/>
      <line x1="210" y1="248.2" x2="1510" y2="248.2"/>
    </g>

    <g font-size="27" fill="#444444">
      <text x="180" y="1039" text-anchor="end">0</text>
      <text x="180" y="778.4" text-anchor="end">5</text>
      <text x="180" y="517.8" text-anchor="end">10</text>
      <text x="180" y="257.2" text-anchor="end">15</text>
    </g>

    <line x1="210" y1="160" x2="210" y2="1030" stroke="#444444" stroke-width="3"/>
    <line x1="210" y1="1030" x2="1510" y2="1030" stroke="#444444" stroke-width="3"/>

    <text x="58" y="595" text-anchor="middle" font-size="31" transform="rotate(-90 58 595)">Wall-clock time (seconds)</text>

    <rect x="390" y="268.1" width="360" height="761.9" fill="#0072B2"/>
    <rect x="970" y="318.7" width="360" height="711.3" fill="#E69F00"/>

    <g stroke="#222222" stroke-width="4">
      <line x1="570" y1="267.8" x2="570" y2="269.1"/>
      <line x1="548" y1="267.8" x2="592" y2="267.8"/>
      <line x1="548" y1="269.1" x2="592" y2="269.1"/>
      <line x1="1150" y1="317.2" x2="1150" y2="320.0"/>
      <line x1="1128" y1="317.2" x2="1172" y2="317.2"/>
      <line x1="1128" y1="320.0" x2="1172" y2="320.0"/>
    </g>

    <g font-size="34" font-weight="600">
      <text x="570" y="238" text-anchor="middle">14.620 s</text>
      <text x="1150" y="289" text-anchor="middle">13.646 s</text>
    </g>

    <g font-size="32">
      <text x="570" y="1088" text-anchor="middle">Standard reverse</text>
      <text x="570" y="1128" text-anchor="middle">Cholesky</text>
      <text x="1150" y="1108" text-anchor="middle">Optimized Körber</text>
    </g>

    <path d="M750 194 C835 148, 930 148, 970 194" fill="none" stroke="#333333" stroke-width="3"/>
    <path d="M958 181 L970 194 L952 197" fill="none" stroke="#333333" stroke-width="3"/>
    <text x="860" y="165" text-anchor="middle" font-size="28" font-weight="600">6.7% lower runtime</text>

    <text x="860" y="1240" text-anchor="middle" font-size="23" fill="#666666">Error bars show the interquartile range across the five runs.</text>
  </g>
</svg>
